<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Big Signs</title>
  <link rel="stylesheet" href="../shared/base.css">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="topbar">
    <a class="back" href="../" data-i18n="back"></a>
    <h1>Big Signs</h1>
    <span class="subtitle" data-i18n="subtitle"></span>
    <span class="spacer"></span>
    <select id="lang" aria-label="Language / Язык"></select>
  </div>

  <main>
    <section class="step">
      <h2><span class="number">1</span><span data-i18n="stepText"></span></h2>
      <div class="entry">
        <input type="text" id="text" maxlength="64" spellcheck="false" autocomplete="off" autocapitalize="characters" enterkeyhint="done">
        <button id="clear" data-i18n="clear"></button>
      </div>
      <p class="hint warning" id="unknown" hidden></p>
    </section>

    <section class="step">
      <h2><span class="number">2</span><span id="fontsLabel" data-i18n="stepFont"></span></h2>
      <div class="options">
        <label class="field"><span data-i18n="sign"></span>
          <select id="sign">
            <option value="standing" data-i18n="sign_standing"></option>
            <option value="hanging" data-i18n="sign_hanging"></option>
          </select>
        </label>
        <label class="check" data-i18n-title="italicTip"><input type="checkbox" id="italic"><span data-i18n="italic"></span></label>
      </div>
      <p class="hint" id="signHint" data-i18n="signHint" hidden></p>
      <div class="fonts" id="fonts" role="radiogroup" aria-labelledby="fontsLabel"></div>
      <p class="hint" id="styleHint"></p>
      <details class="more" id="symbolsBox" open>
        <summary><span data-i18n="symbols"></span> <span class="hint" data-i18n="symbolsHint"></span></summary>
        <div class="symbols" id="symbols"></div>
      </details>
    </section>

    <section class="step">
      <h2><span class="number">3</span><span data-i18n="stepSigns"></span><span class="count" id="count"></span></h2>
      <p class="hint" data-i18n="howTo"></p>
      <p class="hint warning" id="tooWide" hidden></p>
      <p class="empty" id="empty" data-i18n="empty"></p>
      <div class="signs" id="signs"></div>
    </section>

    <footer>
      <p class="hint" data-i18n="accuracy"></p>
      <p class="hint">
        <span data-i18n="credit"></span>
        <a href="https://superfromnd.gitlab.io/bigsigns/" target="_blank" rel="noopener">Big Sign Letters</a>
        <span data-i18n="creditBy"></span>
      </p>
    </footer>
  </main>

  <div class="status" id="status" role="status" aria-live="polite"></div>
  <script type="module" src="app.js"></script>
</body>
</html>
