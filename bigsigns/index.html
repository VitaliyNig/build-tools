<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Big Signs</title>
  <link rel="stylesheet" href="../shared/base.css">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="topbar">
    <a class="back" href="../" data-i18n="back"></a>
    <h1>Big Signs</h1>
    <span class="subtitle" data-i18n="subtitle"></span>
    <span class="spacer"></span>
    <select id="lang" aria-label="Language / Язык"></select>
  </div>

  <main>
    <div class="entry">
      <input type="text" id="text" maxlength="64" spellcheck="false" autocomplete="off">
      <button id="clear" data-i18n="clear"></button>
    </div>
    <div class="option"><b data-i18n="symbols"></b><span class="hint" data-i18n="symbolsHint"></span></div>
    <div class="symbols" id="symbols"></div>
    <div class="option"><label for="sign" data-i18n="sign"></label>
      <select id="sign">
        <option value="standing" data-i18n="sign_standing"></option>
        <option value="hanging" data-i18n="sign_hanging"></option>
      </select>
    </div>
    <p class="hint" id="signHint" data-i18n="signHint" hidden></p>
    <div class="option"><b id="fontsLabel" data-i18n="style"></b>
      <label class="check" data-i18n-title="italicTip"><input type="checkbox" id="italic"><span data-i18n="italic"></span></label>
    </div>
    <div class="fonts" id="fonts" role="radiogroup" aria-labelledby="fontsLabel"></div>
    <p class="hint" data-i18n="howTo"></p>
    <p class="hint" id="styleHint"></p>
    <p class="hint" id="unknown" hidden></p>
    <p class="hint" id="tooWide" hidden></p>

    <div class="signs" id="signs"></div>

    <p class="hint" data-i18n="accuracy"></p>
    <p class="hint">
      <span data-i18n="credit"></span>
      <a href="https://superfromnd.gitlab.io/bigsigns/" target="_blank" rel="noopener">Big Sign Letters</a>
      <span data-i18n="creditBy"></span>
    </p>
  </main>

  <div class="status" id="status" role="status" aria-live="polite"></div>
  <script type="module" src="app.js"></script>
</body>
</html>
