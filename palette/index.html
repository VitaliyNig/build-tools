<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Palette</title>
  <link rel="stylesheet" href="../shared/base.css">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="topbar">
    <a class="back" href="../" data-i18n="back"></a>
    <h1>Palette</h1>
    <span class="subtitle" data-i18n="subtitle"></span>
    <span class="spacer"></span>
    <select id="lang" aria-label="Language / Язык"></select>
  </div>

  <div class="layout">
    <main>
      <div class="bar">
        <label><span data-i18n="version"></span> <select id="paletteVersion"></select></label>
        <button id="addJar" data-i18n="addJar"></button>
        <input type="file" id="jarFile" accept=".jar" hidden>
        <span class="spacer"></span>
        <label data-i18n-title="sideTip"><span data-i18n="side"></span>
          <select id="side">
            <option value="all" data-i18n="sideAll"></option>
            <option value="side" data-i18n="sideSide"></option>
            <option value="top" data-i18n="sideTop"></option>
            <option value="bottom" data-i18n="sideBottom"></option>
          </select></label>
        <label class="check" data-i18n-title="noFallingTip"><input type="checkbox" id="noFalling"><span data-i18n="noFalling"></span></label>
        <label class="check" data-i18n-title="noTechnicalTip"><input type="checkbox" id="noTechnical" checked><span data-i18n="noTechnical"></span></label>
        <label class="check" data-i18n-title="smoothTip"><input type="checkbox" id="smooth"><span data-i18n="smooth"></span></label>
      </div>

      <div class="tabs" role="tablist">
        <button id="tabMatch" role="tab" aria-selected="true" data-i18n="tabMatch"></button>
        <button id="tabHarmony" role="tab" aria-selected="false" data-i18n="tabHarmony"></button>
        <button id="tabGradient" role="tab" aria-selected="false" data-i18n="tabGradient"></button>
      </div>

      <section id="matchPane">
        <div class="match">
          <div class="picker">
            <div class="picker-area">
              <div class="shade" id="shade"><span class="knob" id="shadeKnob"></span></div>
              <div class="hue" id="hue"><span class="knob" id="hueKnob"></span></div>
            </div>
            <div class="picker-row">
              <input type="text" id="hex" class="hex" value="#7fb238" spellcheck="false" aria-label="HEX">
              <button id="randomColour" data-i18n-title="randomColourTip">🎲</button>
              <button id="pickBlock" data-i18n-title="pickBlockTip" aria-pressed="false">
                <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round" d="M12 3l8 4.5v9L12 21l-8-4.5v-9L12 3zM4 7.5l8 4.5 8-4.5M12 12v9"/></svg>
              </button>
              <button id="eyedropper" data-i18n-title="eyedropperTip" hidden>
                <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path fill="currentColor" d="M20.7 5.6l-2.3-2.3a1 1 0 0 0-1.4 0l-3.1 3.1-1.9-1.9-1.4 1.4 1.4 1.4L3 16.3V21h4.7l9-9 1.4 1.4 1.4-1.4-1.9-1.9 3.1-3.1a1 1 0 0 0 0-1.4zM6.9 19H5v-1.9l8.4-8.4 1.9 1.9L6.9 19z"/></svg>
              </button>
            </div>
            <div class="source" id="source" hidden>
              <span data-i18n="sourceLabel"></span><span class="source-tile" id="sourceTile"></span><b id="sourceName"></b>
            </div>
            <label class="slider" data-i18n-title="spreadTip"><span data-i18n="spread"></span>
              <input type="range" id="spread" min="5" max="80" value="22">
              <input type="number" id="spreadValue" min="5" max="80" value="22" aria-label="Colour range"></label>
          </div>
          <div class="group wide">
            <h2 data-i18n="matchingBlocks"></h2>
            <div class="tiles" id="blockResults"></div>
          </div>
          <div class="group">
            <h2 data-i18n="decorations"></h2>
            <div class="tiles" id="decoResults"></div>
          </div>
        </div>
        <input type="search" id="search">
        <p class="hint" data-i18n="matchHint"></p>
      </section>

      <section id="harmonyPane" hidden>
        <div class="harmony">
          <div class="wheel-side">
            <div class="wheel" id="wheel">
              <canvas id="wheelCanvas" width="260" height="260"></canvas>
            </div>
            <label class="slider"><span data-i18n="brightness"></span>
              <input type="range" id="brightness" min="0" max="100" value="100"></label>
            <div class="bar">
              <input type="color" id="harmonyColour" value="#7fb238" aria-label="Colour">
              <input type="text" id="harmonyHex" class="hex" value="#7fb238" size="8" spellcheck="false" aria-label="HEX">
              <button id="harmonyBlock" class="icon" data-i18n-title="harmonyBlockTip"><svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round" d="M12 3l8 4.5v9L12 21l-8-4.5v-9L12 3zM4 7.5l8 4.5 8-4.5M12 12v9"/></svg></button>
            </div>
            <div><b data-i18n="harmonyRule"></b> <span id="ruleName"></span></div>
            <div class="rules" id="rules"></div>
          </div>
          <div class="scheme-side">
            <div class="scheme" id="scheme"></div>
            <div class="bar">
              <button id="harmonyAdd" data-i18n="harmonyAdd" data-i18n-title="harmonyAddTip"></button>
              <span class="hint" data-i18n="harmonyHint"></span>
            </div>
          </div>
        </div>
      </section>

      <section id="gradientPane" hidden>
        <div class="gradient-bar">
          <button id="stopLeft" data-i18n-title="stopLeftTip">＋</button>
          <div class="track">
            <div class="segments" id="segments"></div>
            <div class="tags" id="tags"></div>
          </div>
          <button id="stopRight" data-i18n-title="stopRightTip">＋</button>
          <button id="swapStops" data-i18n-title="swapTip">⇄</button>
          <button id="randomStops" data-i18n-title="randomTip">🎲</button>
        </div>
        <p class="hint" data-i18n="gradientHint"></p>
        <div class="bar">
          <label class="check"><input type="checkbox" id="unique" checked><span data-i18n="unique"></span></label>
          <label class="check"><input type="checkbox" id="oneRow"><span data-i18n="oneRow"></span></label>
          <label class="check" data-i18n-title="oklabTip"><input type="checkbox" id="oklab" checked><span data-i18n="oklab"></span></label>
          <label class="check"><input type="checkbox" id="withDeco"><span data-i18n="withDeco"></span></label>
        </div>
        <div class="rows" id="gradientRows"></div>
        <div class="bar">
          <button id="keepRow" data-i18n="keepRow" data-i18n-title="keepRowTip"></button>
          <button id="addGradient" data-i18n="addGradient"></button>
          <button id="stopsFromPalette" data-i18n="stopsFromPalette"></button>
        </div>
        <div class="history" id="history" hidden>
          <header>
            <h2 data-i18n="history"></h2>
            <button id="clearHistory" data-i18n="clearHistory"></button>
          </header>
          <div class="rows" id="historyRows"></div>
        </div>
      </section>
    </main>

    <aside>
      <h2 data-i18n="myPalette"></h2>
      <div class="tiles mine" id="mine"></div>
      <p class="hint" id="mineHint" data-i18n="mineHint"></p>
      <ul id="mineNames"></ul>
      <div class="bar">
        <input type="text" id="paletteName" maxlength="40">
        <button id="save" data-i18n="save"></button>
      </div>
      <div class="bar">
        <button id="share" data-i18n="share"></button>
        <button id="copyNames" data-i18n="copyNames"></button>
        <button id="clear" data-i18n="clear"></button>
      </div>
      <h2 data-i18n="saved"></h2>
      <ul id="savedList"></ul>
      <p class="hint" id="savedHint" data-i18n="savedHint"></p>
    </aside>
  </div>

  <dialog id="blockDialog">
    <form method="dialog">
      <header>
        <h2 data-i18n="chooseBlock"></h2>
        <button value="cancel" data-i18n="cancel"></button>
      </header>
      <input type="search" id="blockSearch">
      <div class="tiles" id="blockChoices"></div>
      <p class="hint" data-i18n="chooseBlockHint"></p>
    </form>
  </dialog>

  <div class="status" id="status" role="status"></div>
  <script type="module" src="app.js"></script>
</body>
</html>
